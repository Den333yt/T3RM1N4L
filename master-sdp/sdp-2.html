<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ТРЕВОГА: СЕКТОР SDP-2</title>
  <script>
    (function () {
      try {
        const raw = localStorage.getItem('sdp2_access');
        if (raw) {
          const data = JSON.parse(raw);
          if (data && data.expires && Date.now() < data.expires) { window.location.replace('sector.html'); }
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html, body { margin: 0; height: 100%; padding: 0; width: 100%; min-height: 100vh; background-color: #050005; box-sizing: border-box; }
    body { padding: 15px; color: #00CED1; font-family: 'Courier New', Courier, monospace; position: relative; animation: monitor-flicker 0.05s infinite; overflow-x: hidden; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
    body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%); z-index: 9999; background-size: 100% 4px; pointer-events: none; }
    .terminal-container { width: 100%; max-width: 100%; display: block; box-sizing: border-box; text-align: left; }
    h1 { font-size: 24px; text-transform: uppercase; border-bottom: 2px dashed #1E90FF; padding-bottom: 10px; margin: 0 auto 25px auto; letter-spacing: 2px; text-shadow: 0 0 6px #1E90FF; text-align: center; width: max-content; max-width: 100%; overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; animation: typingTitle 1.5s steps(20) 0.2s forwards, blinkCursor 0.8s step-end infinite; }
    .line-wrapper { width: 100%; max-width: 100%; display: block; margin-bottom: 14px; box-sizing: border-box; }
    .content-text { opacity: 0; white-space: normal; word-break: break-word; font-size: 17px; display: inline-block; max-width: 100%; overflow: hidden; border-right: 3px solid transparent; line-height: 1.5; text-shadow: 0 0 4px #00CED1; }
    @media (min-width: 768px) { body { padding: 30px; } h1 { font-size: 28px; } .content-text { white-space: nowrap; font-size: 18px; } }
    @keyframes typingTitle { from { max-width: 0; } to { max-width: 100%; } }
    @keyframes blinkCursor { 50% { border-color: #b0559e; } }
    @keyframes typing { from { max-width: 0; opacity: 1; } to { max-width: 100%; opacity: 1; } }
    @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #b0559e; } }
    @keyframes monitor-flicker { 0% { opacity: 0.98; } 50% { opacity: 1; } 100% { opacity: 0.99; } }
    @keyframes fadeInButton { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .code-form { width: 100%; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; opacity: 0; box-sizing: border-box; }
    .code-input { background: transparent; border: 2px solid #00CED1; color: #00CED1; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; padding: 12px 16px; letter-spacing: 4px; text-transform: uppercase; text-align: center; outline: none; box-sizing: border-box; max-width: 100%; box-shadow: 0 0 10px rgba(0,206,209,0.2); transition: all 0.3s ease; }
    .code-input::placeholder { color: rgba(0,206,209,0.35); letter-spacing: 2px; }
    .code-input:focus { box-shadow: 0 0 25px rgba(0,206,209,0.6); border-color: #00FFFF; }
    .code-input.error { border-color: #ff3333; color: #ff3333; box-shadow: 0 0 25px rgba(255,51,51,0.7); animation: shake 0.4s; }
    .code-input.success { border-color: #00FA9A; color: #00FA9A; box-shadow: 0 0 30px rgba(0,250,154,0.8); }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .button-container { width: 100%; display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-top: 25px; opacity: 0; box-sizing: border-box; }
    .terminal-btn { display: inline-block; padding: 12px 28px; background-color: transparent; color: #00CED1; border: 2px solid #00CED1; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; cursor: pointer; box-shadow: 0 0 10px rgba(0,206,209,0.2); text-shadow: 0 0 4px #00CED1; transition: all 0.3s ease; text-align: center; box-sizing: border-box; max-width: 100%; }
    .terminal-btn:hover { background-color: #00CED1; color: #000000; box-shadow: 0 0 25px rgba(0,206,209,0.6); text-shadow: none; }
    .terminal-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .status-msg { width: 100%; text-align: center; margin-top: 14px; font-size: 14px; min-height: 1.4em; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s; }
    .status-msg.show { opacity: 1; }
    .status-msg.ok   { color: #00FA9A; text-shadow: 0 0 8px rgba(0,250,154,0.8); }
    .status-msg.bad  { color: #ff3333; text-shadow: 0 0 8px rgba(255,51,51,0.8); }
    .line-1 { animation: typing 1.2s steps(40) 0.0s forwards, blink 0.5s step-end 1.2s 1; }
    .line-2 { animation: typing 1.2s steps(40) 1.5s forwards, blink 0.5s step-end 2.7s 1; }
    .line-3 { animation: typing 1.2s steps(40) 3.0s forwards, blink 0.5s step-end 4.2s 1; }
    .line-4 { animation: typing 1.2s steps(40) 4.5s forwards, blink 0.8s step-end 5.7s 1; }
    .line-5 { animation: typing 1.2s steps(40) 5.5s forwards, blink 0.8s step-end 6.7s 1; }
    .code-form        { animation: fadeInButton 0.6s ease-out 6.7s forwards; }
    .button-container { animation: fadeInButton 0.6s ease-out 6.7s forwards; }
    @media (max-width: 500px) { h1 { white-space: normal; animation: fadeInButton 0.5s forwards; border: none; } }
  </style>
</head>
<body>
  <h1>СЕКТОР SDP-2</h1>
  <div class="terminal-container">
    <div class="line-wrapper"><div class="content-text line-1">- ИНИЦИАЛИЗАЦИЯ КАНАЛА SDP-2... [ДОСТУП ПОЛУЧЕН]</div></div>
    <div class="line-wrapper"><div class="content-text line-2">- ВНИМАНИЕ: Зафиксирована активность в ядре QWERTY.</div></div>
    <div class="line-wrapper"><div class="content-text line-3">- Вы раздобыли ключ доступа к БАЗЕ ДАННЫХ СЕКТОРА - SDP-2.</div></div>
    <div class="line-wrapper" style="margin-top: 15px;"><div class="content-text line-4" style="color: #00CED1;">- [ ВВЕДИТЕ КОД ДОСТУПА ДЛЯ ПРОВЕРКИ ]</div></div>
    <div class="line-wrapper"><div class="content-text line-5" style="color: #00CED1;">- [ ОЖИДАНИЕ ВВОДА... ]</div></div>
    <div class="code-form">
      <input type="text" id="codeInput" class="code-input" placeholder="ВВЕДИТЕ КОД" autocomplete="off" spellcheck="false" maxlength="20">
      <button class="terminal-btn" id="submitBtn" type="button">[ ПРОВЕРИТЬ КОД ]</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="button-container">
      <a href="../level3.html" class="terminal-btn">&lt;&lt; НАЗАД В ТЕРМИНАЛ</a>
    </div>
  </div>
  <script>
    const VALID_CODES = ['QW3RTY-91X', 'D4RK-4RCH1V3', 'SDP2-K3Y-77'];
    const ACCESS_HOURS = 72;
    const input = document.getElementById('codeInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    function normalize(str) { return str.trim().toUpperCase().replace(/\s+/g, ''); }
    function checkCode() {
      const value = normalize(input.value);
      if (!value) { input.classList.remove('success'); input.classList.add('error'); statusMsg.textContent = '[ ОШИБКА: ПОЛЕ ПУСТОЕ ]'; statusMsg.className = 'status-msg show bad'; setTimeout(() => input.classList.remove('error'), 800); return; }
      if (VALID_CODES.includes(value)) {
        input.classList.remove('error'); input.classList.add('success');
        input.disabled = true; submitBtn.disabled = true;
        statusMsg.textContent = '[ ДОСТУП РАЗРЕШЁН. ВХОД В СЕКТОР... ]'; statusMsg.className = 'status-msg show ok';
        const expires = Date.now() + (ACCESS_HOURS * 60 * 60 * 1000);
        try { localStorage.setItem('sdp2_access', JSON.stringify({ expires })); } catch(e) {}
        setTimeout(() => { window.location.href = 'sector.html'; }, 1200);
      } else {
        input.classList.remove('success'); input.classList.add('error');
        statusMsg.textContent = '[ ОТКАЗАНО: НЕВЕРНЫЙ КОД ]'; statusMsg.className = 'status-msg show bad';
        input.value = ''; setTimeout(() => input.classList.remove('error'), 800); input.focus();
      }
    }
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); checkCode(); } });
    submitBtn.addEventListener('click', checkCode);
    input.addEventListener('input', () => { input.classList.remove('error'); statusMsg.classList.remove('show'); });
  </script>
</body>
</html>
