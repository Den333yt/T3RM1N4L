<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USOV // СБОЙ</title>
  <style>
    body {
      background-color: #050505;
      color: #FF8C00;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; margin: 0; overflow: hidden;
      animation: shake-soft 4s infinite; /* Мягкая тряска экрана */
    }

    /* КЛАСС ДЛЯ ГЛИТЧА */
    .glitch-all {
      position: relative;
      display: inline-block;
      text-transform: uppercase;
      font-weight: bold;
    }

    /* Псевдо-элементы для глитча */
    .glitch-all::before, .glitch-all::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #050505;
      overflow: hidden;
    }

    .glitch-all::before { left: 2px; text-shadow: -2px 0 red; animation: glitch-anim-1 2s infinite linear alternate-reverse; }
    .glitch-all::after { left: -2px; text-shadow: 2px 0 blue; animation: glitch-anim-2 3s infinite linear alternate-reverse; }

    /* ЗАГОЛОВОК */
    .title {
      font-size: 50px;
      color: #FFF;
      letter-spacing: 5px;
      text-shadow: 0 0 10px #FF8C00;
    }

    /* ПОДЗАГОЛОВОК */
    .sub-text {
      font-size: 20px;
      margin-top: 20px;
      color: #FF8C00;
      text-align: center;
      line-height: 1.5;
    }

    /* КНОПКА (Ведет на level13.html) */
    .btn-back {
      margin-top: 50px;
      color: #FF8C00;
      text-decoration: none;
      border: 1px solid #FF8C00;
      padding: 10px 20px;
      transition: all 0.3s;
      background: #050505;
      font-size: 16px;
      display: inline-block;
    }
    .btn-back:hover {
      background: #FF8C00;
      color: #000;
      box-shadow: 0 0 20px #FF8C00;
    }

    /* АНИМАЦИИ */
    @keyframes shake-soft {
      0%, 90%, 100% { transform: translate(0, 0); }
      92% { transform: translate(-3px, 2px); }
      94% { transform: translate(3px, -2px); }
      96% { transform: translate(-2px, -3px); }
      98% { transform: translate(2px, 3px); }
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 80% 0); }
      20% { clip-path: inset(60% 0 10% 0); }
      40% { clip-path: inset(40% 0 50% 0); }
      60% { clip-path: inset(80% 0 5% 0); }
      80% { clip-path: inset(10% 0 70% 0); }
      100% { clip-path: inset(30% 0 50% 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      20% { clip-path: inset(30% 0 20% 0); }
      40% { clip-path: inset(70% 0 10% 0); }
      60% { clip-path: inset(20% 0 50% 0); }
      80% { clip-path: inset(50% 0 30% 0); }
      100% { clip-path: inset(5% 0 80% 0); }
    }
  </style>
</head>
<body>

  <!-- Заголовок -->
  <div class="glitch-all title" data-text="USOV">USOV</div>
  
  <!-- Подзаголовок -->
  <div class="glitch-all sub-text" data-text="// СИГНАЛ ПОТЕРЯН // СБОЙ ПОДКЛЮЧЕНИЯ //">
    // СИГНАЛ ПОТЕРЯН //<br>
    // СБОЙ ПОДКЛЮЧЕНИЯ //
  </div>

  <!-- Кнопка с ПРАВИЛЬНЫМ href -->
  <a href="..level13.html" class="glitch-all btn-back" data-text="[ ВЕРНУТЬСЯ В ХАБ ]">
    [ ВЕРНУТЬСЯ В ХАБ ]
  </a>

</body>
</html>
