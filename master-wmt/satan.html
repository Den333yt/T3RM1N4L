<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>??? // ТЕМНЫЙ ТЕРМИНАЛ</title>
  <style>
    /* БАЗОВЫЕ ПЕРЕМЕННЫЕ (Черная тема) */
    :root { 
      --bg: #000000; 
      --main-color: #FF0000; 
      --border-color: #FF0000; 
      --text-color: #880000; 
    }

    html, body { 
      margin: 0; padding: 0; width: 100%; min-height: 100vh; 
      background-color: var(--bg); box-sizing: border-box; overflow: hidden;
    }

    body { 
      color: var(--main-color); font-family: 'Courier New', Courier, monospace; 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      text-shadow: 0 0 8px var(--main-color); 
      position: relative; padding: 20px;
      animation: shake 4s infinite; 
    }

    /* ЭЛТ-ЭФФЕКТ С ПОМЕХАМИ */
    body::before { 
      content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; 
      background: 
        radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,1) 100%), 
        linear-gradient(rgba(0,0,0,0) 50%, rgba(255,0,0,0.1) 50%); 
      background-size: 100% 100%, 100% 4px; 
      z-index: 9999; pointer-events: none; 
      animation: crt-flicker 0.1s infinite; 
    }

    /* ЗАГОЛОВОК */
    h1 { 
      font-size: 40px; text-transform: uppercase; letter-spacing: 10px; 
      color: var(--main-color); margin-bottom: 20px;
      animation: glitch-text 1s infinite linear alternate-reverse;
    }

    /* ТЕКСТ */
    .warning-text {
      max-width: 600px; text-align: center; font-size: 16px; 
      color: var(--text-color); margin-bottom: 30px; line-height: 1.6;
      border: 1px dashed var(--text-color); padding: 15px;
    }

    /* ПОЛЕ ВВОДА */
    .input-group {
      display: flex; flex-direction: column; align-items: center; gap: 15px;
      margin-bottom: 40px;
    }

    .pole_vvoda { 
      background: #000; border: 2px solid var(--main-color); 
      color: var(--main-color); padding: 12px; font-size: 18px; 
      font-family: 'Courier New', monospace; text-align: center;
      outline: none; letter-spacing: 3px; width: 300px;
      box-shadow: 0 0 10px rgba(255,0,0,0.3);
    }
    .pole_vvoda:focus { box-shadow: 0 0 20px rgba(255,0,0,0.8); }

    .btn-submit {
      background: transparent; color: var(--main-color); 
      border: 2px solid var(--main-color); padding: 12px 30px; 
      font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold;
      cursor: pointer; text-transform: uppercase; transition: 0.3s;
    }
    .btn-submit:hover { background: var(--main-color); color: #000; box-shadow: 0 0 30px var(--main-color); }

    /* ПОДСКАЗКА */
    .hint {
      color: #550000; font-size: 14px; margin-top: 20px; text-align: center;
      border-top: 1px solid #330000; padding-top: 10px;
    }

    /* КНОПКА НАЗАД */
    .btn-back { 
      position: absolute; bottom: 20px; color: var(--text-color); text-decoration: none; 
      font-size: 14px; border: 1px solid var(--text-color); padding: 8px 15px;
    }
    .btn-back:hover { background: var(--text-color); color: #000; }

    /* АНИМАЦИИ */
    @keyframes crt-flicker { 0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.95; } }
    @keyframes shake { 
      0%, 90%, 100% { transform: translate(0,0); } 
      92% { transform: translate(-2px, 2px); } 
      94% { transform: translate(2px, -2px); } 
      96% { transform: translate(-1px, -1px); } 
      98% { transform: translate(1px, 1px); } 
    }
    @keyframes glitch-text {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      25% { text-shadow: -2px 0 red, 2px 0 blue; }
      50% { text-shadow: 2px 0 blue, -2px 0 red; }
      75% { text-shadow: -2px 0 blue, 2px 0 red; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }
  </style>
</head>
<body>

  <h1>ТЕРМИНАЛ ЗАКРЫТ</h1>

  <div class="warning-text">
    ЭТОТ СЕКТОР НЕ ЗНАЧИТСЯ НА КАРТАХ СИСТЕМЫ.<br>
    ДЛЯ ДОСТУПА ТРЕБУЕТСЯ КОД, СОБРАННЫЙ ИЗ ИМЕН БОГОВ.<br>
    <span style="font-size: 12px; opacity: 0.6;">(Если ты не знаешь код — уходи. Немедленно.)</span>
  </div>

  <div class="input-group">
    <!-- Поле ввода (класс pole_vvoda) -->
    <input type="text" id="passInput" class="pole_vvoda" placeholder="ВВЕДИТЕ КОД" autocomplete="off">
    <button class="btn-submit" onclick="checkSatanPass()">[ ОТКРЫТЬ ВРАТА ]</button>
  </div>

  <!-- ПОДСКАЗКА -->
  <div class="hint">
    [ Собери имя Врага из 5 букв. Ищи их в секторах WMT. ]
  </div>

  <!-- КНОПКА ВОЗВРАТА -->
  <a href="level13.html" class="btn-back">&lt;&lt; БЕЖАТЬ ОТСЮДА</a>

  <script>
        // ПРОВЕРКА УРОВНЯ ДОСТУПА
    const userLevel = parseInt(localStorage.getItem('t3rm_level')) || 0;

    // Если уровень меньше 4 — не пускаем!
    if (userLevel < 4) {
      document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>[ ДОСТУП ЗАПРЕЩЕН ]</h1><p style='color:red; text-align:center;'>ВАШ УРОВЕНЬ ДОПУСКА НЕДОСТАТОЧЕН ДЛЯ ЭТОГО СЕКТОРА.</p>";
    }
    // ПРАВИЛЬНЫЙ ПАРОЛЬ
    const CORRECT_PASSWORD = "SATAN"; 

    function checkSatanPass() {
      const input = document.getElementById('passInput').value.toUpperCase().trim();
      const correct = document.getElementById('passInput');

      // Если ввели правильный код
      if (input === CORRECT_PASSWORD) {
        document.body.style.backgroundColor = "#330000";
        alert("ВРАТА ОТКРЫТЫ. ДОБРО ПОЖАЛОВАТЬ В БЕЗДНУ.");
        
        // ПЕРЕХОД НА СТРАНИЦУ БЕЗДНЫ
        window.location.href = 'satan-inner.html'; 
        
      } else {
        // Если код неверный
        alert("ДОСТУП ЗАПРЕЩЕН. НЕВЕРНЫЙ КОД.");
        correct.style.borderColor = "#FF0000";
        correct.style.animation = "shake 0.3s";
        setTimeout(() => correct.style.animation = "", 300);
      }
    }

    // Закрытие по Enter
    document.getElementById('passInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkSatanPass();
    });
  </script>

</body>
</html>
