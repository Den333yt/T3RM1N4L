<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WMT // WORLD MASTER TERMINAL</title>
  <style>
    /* БАЗОВЫЕ ПЕРЕМЕННЫЕ */
    :root { 
      --bg: #0a0800; 
      --text-main: #FFD700; 
      --border-color: #FF8C00; 
      --panel-bg: rgba(20, 15, 0, 0.85); 
    }

    /* СБРОС И ОСНОВА */
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; background-color: var(--bg); box-sizing: border-box; }
    body { padding: 15px; color: var(--text-main); font-family: 'Courier New', Courier, monospace; position: relative; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    /* ЭЛТ-ЭФФЕКТ */
    body::before { 
      content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; z-index: 9999; pointer-events: none; 
      background: radial-gradient(circle, rgba(10,8,0,0) 60%, rgba(10,8,0,0.9) 100%), repeating-linear-gradient(0deg, rgba(0,0,0,0.3), rgba(0,0,0,0.3) 1px, transparent 1px, transparent 3px); 
      animation: crt-flicker 0.15s infinite; 
    }

    /* КОНТЕЙНЕР */
    .wmt-container { width: 100%; max-width: 800px; padding: 40px 30px; margin-top: 20px; background: var(--panel-bg); border: 2px solid var(--border-color); box-shadow: 0 0 15px rgba(255, 140, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.2); border-radius: 12px; position: relative; text-align: center; }
    
    /* ЗАГОЛОВКИ И ТЕКСТ */
    h1 { font-size: clamp(24px, 5vw, 32px); text-transform: uppercase; margin: 0 auto 10px auto; letter-spacing: 5px; color: var(--text-main); text-shadow: 0 0 10px #FFD700, 0 0 20px #FF8C00; overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; width: max-content; max-width: 100%; animation: typingTitle 1.5s steps(5) 0.2s forwards, blinkCursor 0.8s step-end infinite; }
    .subtitle { text-align: center; font-size: 14px; color: rgba(255, 215, 0, 0.7); margin: 0 auto 40px auto; letter-spacing: 2px; text-transform: uppercase; overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; width: max-content; max-width: 100%; animation: typingText 2s steps(25) 1s forwards, blinkCursor 0.8s step-end infinite; }
    p { overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; margin: 0 auto 30px auto; width: max-content; max-width: 100%; animation: typingText 2s steps(50) 2s forwards, blinkCursor 0.8s step-end infinite; opacity: 0; }
    
    /* МЕНЮ */
    .menu-list { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; opacity: 0; animation: fadeIn 0.5s 3.5s forwards; }
    
    /* ОБЫЧНЫЕ КНОПКИ */
    .wmt-btn { display: inline-block; padding: 15px 20px; background: rgba(255, 215, 0, 0.05); border: 2px solid var(--text-main); color: var(--text-main); font-size: 18px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; text-decoration: none; transition: all 0.3s ease; text-align: center; box-shadow: inset 0 0 10px rgba(255,215,0,0.1); }
    .wmt-btn:hover { background: var(--text-main); color: #000; box-shadow: 0 0 30px var(--text-main); }
    
    /* СЕКРЕТНАЯ КНОПКА ПЕРВОИСТОЧНИКА */
    .wmt-btn.secret { border-color: #DF00FF; color: #DF00FF; box-shadow: 0 0 15px rgba(223,0,255,0.3); text-shadow: 0 0 5px #DF00FF; }
    .wmt-btn.secret:hover { background: #DF00FF; color: #000; box-shadow: 0 0 30px #DF00FF; }

    /* ==========================================
       КРОВАВАЯ КНОПКА САТАНЫ (Появляется с задержкой)
       ========================================== */
    .btn-satan {
      display: inline-block; 
      width: 100%; 
      padding: 15px 20px; 
      box-sizing: border-box;
      background: rgba(50, 0, 0, 0.6);
      border: 2px solid #FF0000;
      color: #FF0000; 
      font-size: 18px; 
      font-weight: bold; 
      text-transform: uppercase; 
      letter-spacing: 5px;
      cursor: pointer; 
      text-decoration: none; 
      text-align: center;
      position: relative;
      overflow: hidden;
      
      /* Кровавое свечение */
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4), inset 0 0 15px rgba(255, 0, 0, 0.2);
      text-shadow: 0 0 8px #FF0000, 0 0 15px #FF0000;
      
      /* Скрыта по умолчанию, появляется с задержкой 5.5 сек */
      opacity: 0;
      animation: 
        fadeIn 1s 5.5s forwards, 
        blood-pulse 2s 5.5s infinite alternate, 
        text-shake 0.2s infinite; 
    }

    /* Псевдо-элементы для эффекта "разъезжающихся" букв */
    .btn-satan::before, .btn-satan::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
      pointer-events: none;
    }
    
    /* Синий сдвиг */
    .btn-satan::before {
      left: 3px; text-shadow: -3px 0 blue; opacity: 0.8;
      animation: glitch-anim-1 1.5s infinite linear alternate-reverse;
    }
    
    /* Красный сдвиг */
    .btn-satan::after {
      left: -3px; text-shadow: 3px 0 red; opacity: 0.8;
      animation: glitch-anim-2 2s infinite linear alternate-reverse;
    }

    .btn-satan:hover {
      background: #FF0000; color: #000;
      box-shadow: 0 0 50px #FF0000, inset 0 0 30px #FF0000;
      animation: none; 
      text-shadow: none;
    }
    .btn-satan:hover::before, .btn-satan:hover::after { display: none; }

    /* КНОПКА НАЗАД */
    .btn-back { display: inline-block; margin-top: 30px; color: var(--text-main); text-decoration: none; border-bottom: 1px solid var(--text-main); padding-bottom: 2px; opacity: 0; animation: fadeIn 0.5s 7s forwards; }
    .btn-back:hover { color: #FFF; border-color: #FFF; text-shadow: 0 0 10px #FFF; }

    /* АНИМАЦИИ */
    @keyframes typingTitle { from { max-width: 0; } to { max-width: 100%; } }
    @keyframes typingText { from { max-width: 0; opacity: 1; } to { max-width: 100%; opacity: 1; } }
    @keyframes blinkCursor { 50% { border-color: var(--text-main); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes crt-flicker { 0% { opacity: 0.95; } 50% { opacity: 1; } 100% { opacity: 0.98; } }
    
    @keyframes blood-pulse {
      0% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.3), inset 0 0 10px rgba(255, 0, 0, 0.1); border-color: #880000; }
      100% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.4); border-color: #FF0000; }
    }
    
    @keyframes text-shake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, -1px); }
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(20% 0 80% 0); }
      20% { clip-path: inset(60% 0 10% 0); }
      40% { clip-path: inset(40% 0 50% 0); }
      60% { clip-path: inset(80% 0 5% 0); }
      80% { clip-path: inset(10% 0 70% 0); }
      100% { clip-path: inset(30% 0 50% 0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      20% { clip-path: inset(30% 0 20% 0); }
      40% { clip-path: inset(70% 0 10% 0); }
      60% { clip-path: inset(20% 0 50% 0); }
      80% { clip-path: inset(50% 0 30% 0); }
      100% { clip-path: inset(5% 0 80% 0); }
    }

    /* АДАПТИВ */
    @media (max-width: 500px) { 
      h1, .subtitle, p { white-space: normal; animation: fadeIn 1s forwards; border: none; width: 100%; } 
      .wmt-btn, .btn-satan { font-size: 16px; padding: 12px 10px; }
    }
  </style>
</head>
