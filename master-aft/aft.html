<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFT // ВЕРИФИКАЦИЯ</title>
  <style>
    :root { --bg: #050005; --text-main: #E0B0FF; --text-toxic: #DF00FF; --border-color: #8A2BE2; --panel-bg: rgba(15, 0, 20, 0.85); }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; background-color: var(--bg); box-sizing: border-box; }
    body { padding: 15px; color: var(--text-main); font-family: 'Courier New', Courier, monospace; position: relative; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; z-index: 9999; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3), rgba(0,0,0,0.3) 1px, transparent 1px, transparent 3px); }
    
    .gate-container { width: 100%; max-width: 600px; padding: 40px 20px; background: var(--panel-bg); border: 2px solid #FF0000; box-shadow: 0 0 30px rgba(255,0,0,0.3); text-align: center; }
    
    h1 { color: #FF0000; text-shadow: 0 0 10px #FF0000; margin: 0 auto 10px auto; font-size: 24px; letter-spacing: 2px; overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; width: max-content; max-width: 100%; animation: typingTitle 1.5s steps(15) 0.2s forwards, blinkCursor 0.8s step-end infinite; }
    p { overflow: hidden; white-space: nowrap; border-right: 2px solid transparent; margin: 0 auto 20px auto; width: max-content; max-width: 100%; animation: typingText 2s steps(40) 1s forwards, blinkCursor 0.8s step-end infinite; opacity: 0; }
    
    .input-wrapper { display: flex; justify-content: center; width: 100%; margin-bottom: 20px; opacity: 0; animation: fadeIn 0.5s 3s forwards; }
    .code-input { background: rgba(0,0,0,0.6); border: 2px solid var(--text-toxic); color: #FFF; font-family: 'Courier New', Courier, monospace; font-size: 18px; padding: 15px; letter-spacing: 4px; text-align: center; outline: none; width: 100%; max-width: 400px; text-transform: uppercase; box-shadow: 0 0 10px rgba(223,0,255,0.3); }
    .code-input:focus { border-color: #FFF; box-shadow: 0 0 20px #FFF; }
    .code-input.error { border-color: #FF0000; animation: shake 0.4s; }
    
    .btn-wrapper { display: flex; justify-content: center; width: 100%; opacity: 0; animation: fadeIn 0.5s 3s forwards; }
    .btn-submit { padding: 12px 30px; background: var(--text-toxic); color: #000; border: none; font-family: 'Courier New', Courier, monospace; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; text-transform: uppercase; box-shadow: 0 0 15px rgba(223,0,255,0.4); }
    .btn-submit:hover { background: #FFF; box-shadow: 0 0 20px #FFF; }
    
    .status-msg { margin-top: 20px; font-weight: bold; min-height: 1.5em; letter-spacing: 1px; opacity: 0; transition: opacity 0.3s; }
    .status-msg.show { opacity: 1; }
    .status-msg.ok { color: #00FA9A; text-shadow: 0 0 10px #00FA9A; }
    .status-msg.bad { color: #FF0000; text-shadow: 0 0 10px #FF0000; }
    
    @keyframes typingTitle { from { max-width: 0; } to { max-width: 100%; } }
    @keyframes typingText { from { max-width: 0; opacity: 1; } to { max-width: 100%; opacity: 1; } }
    @keyframes blinkCursor { 50% { border-color: var(--text-main); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    @media (max-width: 500px) { h1, p { white-space: normal; animation: fadeIn 1s forwards; border: none; width: 100%; } }
  </style>
</head>
<body>
  <div class="gate-container">
    <h1>ТРЕБУЕТСЯ ПАРОЛЬ</h1>
    <p>ВВЕДИТЕ КОД ДОСТУПА ДЛЯ АНОМАЛИИ #000X</p>
    <div class="input-wrapper"><input type="text" id="codeInput" class="code-input" placeholder="********" autocomplete="off"></div>
    <div class="btn-wrapper"><button class="btn-submit" id="submitBtn">ПОДТВЕРДИТЬ</button></div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
  <script>
    const VALID_CODES = ['T3RM1N4L', 'DARK-PORTAL', 'BLACK-000X'];
    const input = document.getElementById('codeInput');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    function check() {
      const val = input.value.trim().toUpperCase();
      if (VALID_CODES.includes(val)) {
        msg.textContent = '[ ДОСТУП РАЗРЕШЁН. ПОРТАЛ ОТКРЫВАЕТСЯ. ]';
        msg.className = 'status-msg show ok';
        setTimeout(() => { window.location.href = 'aft-anomaly-000x.html'; }, 1500);
      } else {
        input.classList.add('error');
        msg.textContent = '[ ОШИБКА: НЕВЕРНЫЙ КОД ]';
        msg.className = 'status-msg show bad';
        setTimeout(() => input.classList.remove('error'), 800);
      }
    }
    btn.addEventListener('click', check);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  </script>
</body>
</html>
