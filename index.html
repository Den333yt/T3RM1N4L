<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QWERTY DARK ARCHIVE</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background-color: #050005; box-sizing: border-box; }
    body { padding: 15px; color: #b0559e; font-family: 'Courier New', Courier, monospace; position: relative; animation: monitor-flicker 0.15s infinite; overflow-x: hidden; }
    body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.4) 50%); background-size: 100% 4px; z-index: 9999; pointer-events: none; }
    .terminal-container { width: 100%; max-width: 100%; display: flex; flex-direction: column; align-items: flex-start; box-sizing: border-box; }
    .line-wrapper { width: 100%; clear: both; margin-bottom: 10px; }
    .terminal-line { opacity: 0; white-space: normal; word-break: break-word; font-size: 4.2vw; display: inline-block; max-width: 100%; overflow: hidden; border-right: 3px solid transparent; text-shadow: 0 0 4px #b0559e, 0 0 12px rgba(176,85,158,0.8); box-sizing: border-box; }
    @media (min-width: 480px) { .terminal-line { font-size: 16px; white-space: nowrap; } }
    @keyframes typing { from { max-width: 0; opacity: 1; } to { max-width: 100%; opacity: 1; } }
    @keyframes blink { from, to { border-color: transparent; } 50% { border-color: #b0559e; } }
    @keyframes monitor-flicker { 0% { opacity: 0.96; } 50% { opacity: 1; } 100% { opacity: 0.97; } }
    @keyframes fadeInButton { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    body.started .line-1 { animation: typing 1.0s steps(30) 0.0s forwards, blink 0.5s step-end 1.0s 2; }
    body.started .line-2 { animation: typing 1.0s steps(30) 1.0s forwards, blink 0.5s step-end 2.0s 2; }
    body.started .line-3 { animation: typing 1.0s steps(30) 2.0s forwards, blink 0.5s step-end 3.0s 2; }
    body.started .line-4 { animation: typing 1.0s steps(30) 3.0s forwards, blink 0.5s step-end 4.0s 2; }
    body.started .line-5 { animation: typing 1.0s steps(30) 4.0s forwards, blink 0.5s step-end 5.0s 2; }
    body.started .line-6 { animation: typing 1.0s steps(30) 5.0s forwards, blink 0.5s step-end 6.0s 2; }
    body.started .line-7 { animation: typing 1.0s steps(30) 6.0s forwards, blink 0.5s step-end 7.0s 2; }
    body.started .line-8 { animation: typing 1.0s steps(30) 7.0s forwards, blink 0.5s step-end 7.0s infinite; }
    .button-container { width: 100%; display: flex; justify-content: center; margin-top: 20px; clear: both; }
    .terminal-btn { padding: 12px 24px; background-color: transparent; color: #b0559e; border: 2px solid #b0559e; font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; cursor: pointer; text-shadow: 0 0 4px #b0559e; opacity: 0; box-shadow: 0 0 10px rgba(176,85,158,0.2); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
    body.started .terminal-btn { animation: fadeInButton 0.6s ease-out 8.2s forwards; }
    .terminal-btn:hover { background-color: #b0559e; color: #050005; box-shadow: 0 0 25px rgba(176,85,158,0.6); text-shadow: none; }
    #boot-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #050005; z-index: 10000; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .boot-text { font-family: 'Courier New', Courier, monospace; font-size: 16px; color: #b0559e; text-shadow: 0 0 8px #b0559e; animation: blink 0.8s step-end infinite; text-align: center; padding: 0 20px; }
  </style>
</head>
<body>
  <audio id="keypress" src="audio/keypress.mp3"></audio>
  <audio id="crt-hum" loop src="audio/crt-hum.mp3"></audio>
  <div id="boot-overlay" onclick="bootSystem()"><div class="boot-text">[ CLICK TO BOOT SYSTEM ]</div></div>
  <div class="terminal-container">
    <div class="line-wrapper"><div class="terminal-line line-1">&gt; INITIALIZING QWERTY DARK ARCHIVE...</div></div>
    <div class="line-wrapper"><div class="terminal-line line-2">&gt; BYPASSING FIREWALL... [SUCCESS]</div></div>
    <div class="line-wrapper"><div class="terminal-line line-3">&gt; INJECTING ROOT EXPLOIT...</div></div>
    <div class="line-wrapper"><div class="terminal-line line-4">&gt; DOWNLOADING ENCRYPTED PROTOCOLS...</div></div>
    <div class="line-wrapper"><div class="terminal-line line-5">&gt; SECURITY ALARM: OVERRIDDEN BY USER.</div></div>
    <div class="line-wrapper"><div class="terminal-line line-6">&gt; EXTRACTING SATELLITE TELEMETRY...</div></div>
    <div class="line-wrapper"><div class="terminal-line line-7">&gt; WIPING ACCESS LOGS...</div></div>
    <div class="line-wrapper"><div class="terminal-line line-8">&gt; SYSTEM READY. ACCESS GRANTED.</div></div>
  </div>
  <div class="button-container">
    <button class="terminal-btn" onclick="window.location.href='database.html'">→[ ENTER SYSTEM ]←</button>
  </div>
  <script>
    function bootSystem() {
      document.body.classList.add('started');
      document.getElementById('boot-overlay').style.display = 'none';
      const hum = document.getElementById('crt-hum'); const keypressSound = document.getElementById('keypress');
      hum.volume = 0.15; keypressSound.volume = 0.3;
      hum.play().catch(err => console.log("audio:", err.message));
      document.querySelectorAll('.terminal-line').forEach((line) => {
        const delay = parseFloat(getComputedStyle(line).animationDelay || "0s") * 1000;
        setTimeout(() => { keypressSound.currentTime = 0; keypressSound.play().catch(() => {}); }, delay);
      });
    }
  </script>
</body>
</html>
